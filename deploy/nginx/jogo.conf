# Site Nginx do jogo (host). Copie para /etc/nginx/sites-available/jogo,
# troque SEU_DOMINIO, ative o symlink e rode `certbot --nginx -d jogo.SEU_DOMINIO`.
# O certbot adiciona o bloco 443/TLS automaticamente — este arquivo é só o HTTP base.
server {
    listen 80;
    server_name jogo.SEU_DOMINIO;

    # Front (build estático do repo do front) servido como SPA.
    root /var/www/jogo;
    index index.html;

    # WebSocket / Socket.IO → backend do jogo (container em 127.0.0.1:3003).
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
