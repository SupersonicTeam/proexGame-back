# Compose de PRODUÇÃO (VPS). Não builda nada — puxa a imagem já publicada no ghcr.io.
# A tag a subir vem de IMAGE_TAG no .env (o CI atualiza isso a cada deploy).
#
# Convive com outros apps da VPS:
#   - Redis sem porta exposta (rede interna do projeto).
#   - Backend exposto só em 127.0.0.1:${BACKEND_PORT} → o Nginx do host faz o proxy/TLS.
services:
  backend:
    image: ghcr.io/supersonicteam/proexgame-back:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Origem do frontend para o CORS. Definida no .env do deploy. A sintaxe
      # `:?` faz o Compose abortar o deploy se a variável estiver ausente/vazia
      # (fail-fast antes mesmo de subir o container).
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:?defina FRONTEND_ORIGIN no .env do deploy}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3003}:3000'
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistência durável (achado #1 do code-review): AOF + volume nomeado para o
    # estado de sessão sobreviver ao recreate do container a cada deploy (IMAGE_TAG).
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

# Volume nomeado do Redis: persiste entre deploys e reboots da VPS (achado #1).
volumes:
  redis_data:
