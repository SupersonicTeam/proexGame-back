# Release & Deploy — dispara quando algo entra na main (PR mergeado).
#
# Fluxo encadeado (a tag criada pelo GITHUB_TOKEN NÃO dispara outro workflow,
# então tudo acontece neste mesmo run):
#   1) Deriva a versão por Conventional Commits, cria a tag vX.Y.Z + GitHub Release.
#   2) Builda a imagem Docker e publica no ghcr.io (privado): :vX.Y.Z + :latest.
#   3) Copia o docker-compose.prod.yml do repo para a VPS (evita drift do arquivo).
#   4) SSH na VPS: atualiza IMAGE_TAG, `docker compose pull` + `up -d` (deploy da tag mais atual).
name: Release & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write # criar tag + release
  packages: write # publicar imagem no ghcr

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Versionar e publicar release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - name: Checkout (histórico completo p/ ler os commits)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calcular versão e criar a tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: 'v'

      - name: Publicar GitHub Release com changelog
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

  build-and-deploy:
    name: Build da imagem e deploy na VPS
    needs: release
    if: ${{ needs.release.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolver nome da imagem (ghcr exige minúsculas)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem (tag + latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.release.outputs.new_version }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sincroniza o compose ANTES do deploy. Sem isto, o arquivo na VPS pode
      # ficar defasado em relação ao repo (drift): mudanças como novas variáveis
      # de ambiente não chegam ao servidor e o container sobe sem elas.
      - name: Sincronizar docker-compose.prod.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.prod.yml
          target: ${{ secrets.VPS_DEPLOY_DIR }}
          strip_components: 1 # remove o prefixo "deploy/" do caminho de destino

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          # MESMA tag publicada no build (new_version, sem o "v") — evita mismatch.
          IMAGE_TAG: ${{ needs.release.outputs.new_version }}
          # Login no ghcr feito na VPS com o GITHUB_TOKEN efêmero do job (tem acesso
          # ao package do próprio repo). Mantém o package privado sem depender de PAT.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_DIR }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
