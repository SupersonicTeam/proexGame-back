# Sobe backend + Redis localmente (e na VPS na Sprint 4) com `docker compose up`.
# Nginx/TLS/wss ficam para a Sprint 4 — aqui o foco é o backend conectado ao Redis.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis NÃO é exposto no host: o backend o acessa pela rede interna (redis:6379).
    # Isso evita conflito de porta e mantém o Redis fora da internet na VPS.
    # Para inspecionar via redis-cli no host, descomente (ajuste a porta se 6379 estiver em uso):
    # ports:
    #   - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # Porta do host configurável (BACKEND_PORT) para evitar conflito com outros serviços.
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
